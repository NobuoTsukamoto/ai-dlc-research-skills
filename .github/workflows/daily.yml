name: Daily coding-agent updates

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: generated-updates
  cancel-in-progress: false

env:
  COPILOT_MODEL: ${{ vars.COPILOT_MODEL || 'gemini-3.8-flash' }}
  COPILOT_ALLOWED_URLS: github.com,api.github.com,raw.githubusercontent.com,github.blog,learn.chatgpt.com,cursor.com,antigravity.google

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Prepare data branch
        run: python .github/scripts/data_branch.py prepare

      - name: Determine target date
        run: echo "TARGET_DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)" >> "$GITHUB_ENV"

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Generate daily report
        run: |
          prompt="$(sed "s/{YYYY-MM-DD}/$TARGET_DATE/" prompts/daily-tool-updates.md)"
          copilot -p "$prompt" -s \
            --model="$COPILOT_MODEL" \
            --allow-tool='shell' \
            --allow-tool='write' \
            --allow-tool='web_fetch' \
            --allow-url="$COPILOT_ALLOWED_URLS"

      - name: Validate generated log
        run: |
          report_path="updates/daily/${TARGET_DATE}.md"
          test -s "$report_path" || {
            echo "Missing or empty daily report: $report_path" >&2
            find updates -maxdepth 3 -type f -print >&2
            exit 1
          }
          python .agents/skills/ai-coding-agent-updates/scripts/update_log.py validate --log updates/update-log.jsonl

      - name: Commit generated updates to data
        run: python .github/scripts/data_branch.py sync
