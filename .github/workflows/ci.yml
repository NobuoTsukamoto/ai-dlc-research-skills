name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Validate skill package
        run: uv run .agents/skills/ai-dlc-research/scripts/validate_skill.py

      - name: Run tests
        run: uv run python -m unittest discover -s .agents/skills/ai-dlc-research/tests -p "test_*.py"

      - name: Run coding-agent update tests
        run: uv run python -m unittest discover -s .agents/skills/ai-coding-agent-updates/tests -p "test_*.py"
