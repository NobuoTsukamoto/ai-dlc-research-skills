name: Weekly coding-agent updates

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: generated-updates
  cancel-in-progress: false

env:
  COPILOT_MODEL: ${{ vars.COPILOT_MODEL || 'gemini-3.8-flash' }}
  COPILOT_ALLOWED_URLS: github.com,api.github.com,raw.githubusercontent.com,github.blog,learn.chatgpt.com,cursor.com,antigravity.google

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Prepare data branch
        run: python .github/scripts/data_branch.py prepare

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Generate weekly report
        run: |
          target_week="$(TZ=Asia/Tokyo date -d '7 days ago' +%G-W%V)"
          prompt="$(sed "s/{YYYY-Www}/$target_week/" prompts/weekly-tool-updates.md)"
          copilot -p "$prompt" -s \
            --model="$COPILOT_MODEL" \
            --allow-tool='shell' \
            --allow-tool='write' \
            --allow-tool='web_fetch' \
            --allow-url="$COPILOT_ALLOWED_URLS"

      - name: Validate generated log
        run: |
          target_week="$(TZ=Asia/Tokyo date -d '7 days ago' +%G-W%V)"
          test -s "updates/weekly/${target_week}.md"
          python .agents/skills/ai-coding-agent-updates/scripts/update_log.py validate --log updates/update-log.jsonl

      - name: Commit generated updates to data
        run: python .github/scripts/data_branch.py sync
